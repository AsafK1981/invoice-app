name: Software Registry Watch

# Weekly check of the PUBLIC software registry for our own listing.
# Approval of application 1369 (filed 2026-09-07) arrives with no promised
# SLA, and the software simply starts appearing in the registry. Weekly is
# enough: this is the backstop for the good news, while tax-email-watch.yml
# polls every few minutes for anything the Tax Authority sends us.
#
# Needs no npm install - the script uses built-in fetch only.

on:
  schedule:
    # Sunday 06:00 UTC = 09:00 Israel. GitHub delays scheduled runs under
    # load, which is harmless at this cadence.
    - cron: '0 6 * * 0'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: software-registry-watch
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Check the public software registry for our listing
        env:
          GAYA_PUSH_TOKEN: ${{ secrets.GAYA_PUSH_TOKEN }}
        run: node scripts/check-software-registry.mjs
