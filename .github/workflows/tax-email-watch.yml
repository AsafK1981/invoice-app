name: Tax Authority Email Watch

on:
  # Cron back on after 2026-05-28 spam incident. Dedup moved server-side
  # (POST /watch-claim on Gaya). No git state to commit anymore — no race.
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tax-email-watch
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install imapflow
        run: npm install --no-save imapflow@1.0.169

      - name: Check inbox for new Tax Authority emails
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          GAYA_PUSH_TOKEN: ${{ secrets.GAYA_PUSH_TOKEN }}
        run: node scripts/check-tax-emails.mjs
