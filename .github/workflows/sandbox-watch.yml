name: Sandbox Watch

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  watch:
    runs-on: ubuntu-latest
    steps:
      - name: Check Tax Authority Sandbox URL
        id: check
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" --max-time 15 \
            https://openapi-portal.taxes.gov.il/shaam/tsandbox/user/login || echo "000")
          echo "Sandbox URL returned: $STATUS"
          echo "current=$STATUS" >> "$GITHUB_OUTPUT"

      - name: Find existing sandbox-up issue (state marker)
        id: find
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ISSUE=$(gh issue list --repo "${{ github.repository }}" \
            --label sandbox-up --state open \
            --json number --jq '.[0].number // ""')
          echo "Existing sandbox-up issue: ${ISSUE:-none}"
          echo "issue=$ISSUE" >> "$GITHUB_OUTPUT"

      - name: Push WhatsApp + open marker when Sandbox came back
        if: steps.check.outputs.current == '200' && steps.find.outputs.issue == ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GAYA_PUSH_TOKEN: ${{ secrets.GAYA_PUSH_TOKEN }}
        run: |
          curl -sS -X POST https://136.111.197.22.nip.io/push \
            -H "Authorization: Bearer $GAYA_PUSH_TOKEN" \
            -H "Content-Type: application/json" \
            -d '{"text":"✅ Sandbox URL של רשות המסים חזר לאוויר! נסה להיכנס:\nhttps://openapi-portal.taxes.gov.il/shaam/tsandbox/user/login","source":"sandbox-watch"}' \
            -o /dev/null -w "Push status: %{http_code}\n"
          gh issue create --repo "${{ github.repository }}" \
            --title "Sandbox URL is UP" \
            --label sandbox-up \
            --body "Sandbox URL returned 200 at $(date -u +%FT%TZ). Auto-closed when status drops."

      - name: Close marker when Sandbox dropped again
        if: steps.check.outputs.current != '200' && steps.find.outputs.issue != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh issue close "${{ steps.find.outputs.issue }}" \
            --repo "${{ github.repository }}" \
            --comment "Sandbox URL returned ${{ steps.check.outputs.current }} at $(date -u +%FT%TZ). Marker closed; will re-fire on next 200."
